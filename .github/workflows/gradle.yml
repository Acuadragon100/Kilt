name: Gradle CI

on:
  push:
    branches:
      - 'eol/acua/*'

permissions:
  contents: write

jobs:
  build:
    environment: Kilt Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0
        filter: tree:0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
    - name: Build artifacts
      run: ./gradlew remapJar
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kilt Build JARs
        path: build/libs/Kilt-*.jar
    - name: Changelog
      run: ./gradlew createGitChangelog
    - uses: benjlevesque/short-sha@v5.0
      id: short-sha
      with:
        length: 6
    - name: Publish
      uses: softprops/action-gh-release@v3
      with:
        title: ${{ steps.short-sha.outputs.sha }}
        tag_name: eol-acua-1.20.1-${{ steps.short-sha.outputs.sha }}
        body_path: build/changelog.md
        prerelease: true
        files: |
          build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
